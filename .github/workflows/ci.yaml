name: Build and Push Frontend

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
      - 'CONTRIBUTING*'
      - 'CODE_OF_CONDUCT*'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
      - 'CONTRIBUTING*'
      - 'CODE_OF_CONDUCT*'

# Cancel in-flight runs for the same PR ref when a new push arrives.
# `cancel-in-progress` is gated to PRs only so main pushes always run
# to completion and always produce an image.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/selfservice-ui

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Prepare env for svelte-kit sync
        # svelte-kit sync loads $env/static/public types from .env (not
        # .env.production). Without this copy, svelte-check reports
        # "Module '$env/static/public' has no exported member 'PUBLIC_X'"
        # for every variable used in src/lib/config.ts.
        run: cp .env.production .env

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

  # Run PR image builds in parallel with test; push builds stay gated.
  build-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps: &build_steps
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps: *build_steps
